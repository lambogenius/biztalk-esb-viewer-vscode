<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BizTalk ESB Viewer</title>
    <style>
      body {
        font-family: var(--vscode-font-family);
        background: var(--vscode-editor-background);
        color: var(--vscode-editor-foreground);
        margin: 0;
        padding: 16px;
      }
      .panel {
        border: 1px solid var(--vscode-panel-border);
        background: var(--vscode-sideBar-background);
        border-radius: 8px;
        padding: 16px;
        box-sizing: border-box;
      }
      h1 {
        margin-top: 0;
        font-size: 1.2rem;
      }
      pre {
        white-space: pre-wrap;
        word-break: break-word;
        margin: 0;
        background: rgba(0,0,0,0.08);
        border-radius: 6px;
        padding: 12px;
      }
    </style>
  </head>
  <body>
    <div class="panel">
      <h1>BizTalk ESB Viewer</h1>
      <pre id="content">Loading ESB document…</pre>
    </div>

    <script>
      (() => {
        const vscode = acquireVsCodeApi();
        const pre = document.getElementById('content');

        window.addEventListener('message', event => {
          const message = event.data;
          if (!message || !message.source) return;
          pre.textContent = message.source;
          document.title = message.fileName || 'BizTalk ESB Viewer';
        });

        vscode.postMessage({ type: 'ready' });
      })();
    </script>
  </body>
</html>
